<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="Workflow Studio preview">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="800" height="420" rx="14" fill="#1e293b"/>
  <rect x="10" y="10" width="780" height="400" rx="10" fill="url(#winBg)" stroke="#334155"/>
  <!-- title bar -->
  <rect x="10" y="10" width="780" height="44" rx="10" fill="#0f172a"/>
  <circle cx="36" cy="32" r="6" fill="#475569"/>
  <circle cx="58" cy="32" r="6" fill="#475569"/>
  <rect x="280" y="22" width="240" height="22" rx="6" fill="#020617" stroke="#334155"/>
  <text x="400" y="37" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Workflow Studio</text>
  <!-- palette -->
  <rect x="28" y="72" width="160" height="320" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="42" y="94" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" font-weight="600">MODULES</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="38" y="106" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/><text x="52" y="129" fill="#e2e8f0">Image Ingest</text>
    <rect x="38" y="150" width="140" height="36" rx="6" fill="#1e293b" stroke="#38bdf8"/><text x="52" y="173" fill="#e2e8f0">Detector (YOLO)</text>
    <rect x="38" y="194" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/><text x="52" y="217" fill="#e2e8f0">Context Bundle</text>
    <rect x="38" y="238" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/><text x="52" y="261" fill="#e2e8f0">OpenAI Vision</text>
    <rect x="38" y="282" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/><text x="52" y="305" fill="#e2e8f0">Graph Output</text>
  </g>
  <!-- canvas -->
  <rect x="208" y="72" width="380" height="210" rx="8" fill="#020617" stroke="#334155"/>
  <text x="398" y="98" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="11">Drag · connect · run pipeline</text>
  <!-- fake nodes -->
  <g filter="url(#shadow)">
    <rect x="240" y="120" width="88" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <rect x="352" y="120" width="88" height="40" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <rect x="464" y="120" width="88" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <rect x="408" y="188" width="88" height="40" rx="6" fill="#1e293b" stroke="#a78bfa"/>
  </g>
  <text x="284" y="145" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10">Ingest</text>
  <text x="396" y="145" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10">YOLO</text>
  <text x="508" y="145" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10">Context</text>
  <text x="452" y="213" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10">VLM</text>
  <path d="M328 140 H352 M440 140 H464 M396 160 V188" stroke="#475569" stroke-width="2" fill="none"/>
  <!-- right panel -->
  <rect x="604" y="72" width="168" height="320" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="618" y="94" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" font-weight="600">RESULT</text>
  <rect x="618" y="104" width="140" height="120" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="628" y="128" fill="#64748b" font-family="ui-monospace,monospace" font-size="9">{</text>
  <text x="636" y="148" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="9">"regions": [...]</text>
  <text x="636" y="168" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="9">"graph": {...}</text>
  <text x="628" y="208" fill="#64748b" font-family="ui-monospace,monospace" font-size="9">}</text>
  <rect x="618" y="240" width="140" height="36" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="688" y="262" text-anchor="middle" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Run pipeline</text>
  <!-- preview strip -->
  <rect x="208" y="296" width="380" height="96" rx="8" fill="#020617" stroke="#334155"/>
  <rect x="224" y="312" width="100" height="64" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="430" y="348" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="11">Image preview · bounding overlays</text>
</svg>
