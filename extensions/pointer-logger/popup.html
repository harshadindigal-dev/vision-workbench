<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; margin: 0; font-size: 13px; }
      button { width: 100%; padding: 8px; margin: 6px 0; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f8fafc; }
      button.primary { background: #4f46e5; color: white; border-color: #4338ca; }
      button.danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
      #status { color: #64748b; font-size: 11px; margin-top: 8px; line-height: 1.4; }
      code { font-size: 11px; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <strong>Pointer logger</strong>
    <p style="margin:8px 0;color:#475569;font-size:12px;">
      Start screen recording immediately after aligning the clock so <code>t_seconds</code> matches the video.
    </p>
    <button id="align" class="primary">Align clock — recording starts NOW</button>
    <button id="clear" class="danger">Clear captured events</button>
    <button id="export">Export JSON</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
